services:
  backend:
    command: >
      sh -c "python scripts/verify_production_runtime.py
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      ENVIRONMENT: production
      LLM_PROVIDER: aliyun
      EMBEDDING_PROVIDER: dashscope
      EMBEDDING_MODEL: text-embedding-v4
      OCR_ENABLED: "true"
      LOG_FORMAT: json
    restart: unless-stopped

  frontend:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  qdrant:
    restart: unless-stopped

  minio:
    restart: unless-stopped
